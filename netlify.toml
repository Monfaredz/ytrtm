# Netlify serves the web app from web/public and the single function from
# web/netlify/functions (both relative to `base`).
[build]
  base = "web"
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/ytm"
  to = "/.netlify/functions/ytm"
  status = 200
