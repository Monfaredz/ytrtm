# Netlify serves the web app from web/public and the single function from
# web/netlify/functions (both relative to `base`). The /api/ytm rewrite lives in
# web/public/_redirects so manual CLI deploys work the same way.
[build]
  base = "web"
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "20"
