[package]
name = "ytmcore"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ytmcore"
crate-type = ["staticlib", "rlib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
